# fly.toml app configuration file generated for data-sandbox on 2026-05-06T17:29:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'data-sandbox'
primary_region = 'fra'

[build]
  dockerfile = 'packages/sandbox-mcp/Dockerfile'

[env]
  # DNS-rebinding protection allowlist for the Streamable HTTP transport.
  # Comma-separated; consumed by parseEnvAllowedHosts() in
  # packages/sandbox-mcp/src/args.mjs. Both the Fly-assigned hostname (the
  # current live URL) and the canonical OF-OS Commons CNAME (PRD D-13) need to
  # be allowlisted so the connector keeps working through DNS cutover.
  MCP_ALLOWED_HOSTS = "data-sandbox.fly.dev,mcp.openfinance-os.org"
  # Public origin used as the OAuth issuer in discovery documents when the
  # opt-in OAuth simulation is enabled (--simulate-oauth). Without it the
  # issuer resolves to the container's internal bind address, which is
  # unroutable behind Fly's TLS terminator. Swap to the canonical CNAME on
  # the D-13 cutover together with MCP_ALLOWED_HOSTS above.
  MCP_PUBLIC_URL = "https://data-sandbox.fly.dev"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
