# fly.toml app configuration file generated for data-sandbox on 2026-05-06T17:29:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'data-sandbox'
primary_region = 'fra'

[build]
  dockerfile = 'packages/sandbox-mcp/Dockerfile'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
