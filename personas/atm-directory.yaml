persona_id: atm_directory
domain: atm
name: "UAE ATM Locator — Public Directory"
# D-10 — Arabic display name (parallel-text UI; English `name` is the fallback).
name_ar: "دليل أجهزة الصراف الآلي في الإمارات — دليل عام"
archetype: atm_locator_directory
default_seed: 47131
segment: Retail
stress_coverage:
  # ATM Locator is the only persona in the library that emits
  # infrastructure data (a public directory of LFI-operated cash
  # machines) rather than customer data. There is no customer
  # behaviour to stress; the persona exists as the (persona, lfi,
  # seed) anchor for the v2.1 `GET /atms` endpoint per Phase 2.3.
  - atm_locator_directory_v1_baseline

# Demographics is required by the schema shape but is not used by the
# ATM generator — the sentinel value below is a stable placeholder so
# the persona-manifest shape test passes. The ATM directory contains
# no PII.
demographics:
  emirate: all
