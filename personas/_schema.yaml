# Persona manifest schema — EXP-02. Validated in CI by tests/persona-manifest.test.mjs.
# Each persona/*.yaml must conform to this shape.
#
# Field meanings:
#   persona_id          stable slug; matches filename without .yaml; used in URLs
#   domain              which OF Data Sharing domain this persona targets
#                       (banking | insurance). Phase 2.0 step 3: banking only;
#                       insurance personas land in a later slice.
#   name                human-readable display name
#   name_ar             optional Arabic display name (D-10 parallel-text UI).
#                       Shown when the UI language is Arabic; the English
#                       `name` is the fallback. Optional — personas not yet
#                       translated simply omit it.
#   narrative_ar        optional Arabic narrative (D-10). Same fallback rule
#                       against the English `narrative`.
#   archetype           short typology tag for filter/search
#   stress_coverage     array of terms drawn from PRD Appendix F controlled vocabulary
#   segment             v2.1-errata1 AccountType/PartyCategory enum value:
#                       Retail | SME | Corporate. Drives AccountType per account
#                       and PartyCategory per party in the generated bundle.
#                       Default: Retail.
#   multi_lfi_footprint            optional. Documents the persona's plausible
#                                  multi-bank reality: which LFI categories
#                                  (operating / trade_finance / acquiring /
#                                  islamic_deposit / escrow / digital_challenger)
#                                  the persona realistically holds accounts at,
#                                  and a candidate set of named UAE banks per
#                                  slot. PURELY DESCRIPTIVE — does NOT bind a
#                                  populate-rate to any named bank (NG5 / D-14).
#                                  The Rich/Median/Sparse `lfi_default` per slot
#                                  is anonymous and stays anonymous in any
#                                  generated bundle. Used today for narrative
#                                  + integration documentation; multi-LFI
#                                  bundle-pair generation is a deferred slice.
#   demographics.nationality_pool  references /synthetic-identity-pool/names/<pool>.yaml
#   income.primary_employer_pool   references /synthetic-identity-pool/employers/<pool>.yaml
#   income.flag_payroll            whether the salary credit carries v2.1 Flags=Payroll
#   organisation                   present iff segment != Retail. Drives
#                                  AccountHolderName on business accounts and
#                                  the Organisation Party records. Fields here
#                                  are deliberately minimal — only those the
#                                  v2.1-errata1 BANK spec actually surfaces.
#   organisation.legal_name_pool   references /synthetic-identity-pool/organisations/<pool>.yaml
#   organisation.signatories[]     drives the Party array; values are spec
#                                  enums (PartyType + AccountRole), enforced by
#                                  tools/lint-persona-spec-conformance.mjs.
#   cash_flow                      transaction-level steering for SME/Corporate
#                                  personas (B2B inflows + supplier outflows
#                                  + payroll outflow). Optional.
#   accounts[].type                v2.1 AccountSubType (CurrentAccount/CreditCard/etc.)
#   accounts[].account_type        optional per-account override of segment
#                                  (Retail|SME|Corporate). Defaults to persona.segment.
#   default_seed                   shipped default seed for stable persona-permalink (§6.8)
#
# This file is documentation, not enforced (yet). The test that validates
# manifests against this shape lives in tests/persona-manifest.test.mjs.
# Spec-conformance of segment/AccountType/PartyType/AccountRole values is
# enforced by tools/lint-persona-spec-conformance.mjs (EXP-01).

persona_id: <slug>
domain: <enum: banking|insurance>
name: <string>
name_ar: <string?>            # optional — D-10 Arabic display name
narrative_ar: <string?>       # optional — D-10 Arabic narrative
archetype: <string>
default_seed: <int>
segment: <enum: Retail|SME|Corporate>          # optional; default Retail
stress_coverage:
  - <term-from-Appendix-F>
demographics:
  nationality_pool: <pool_id>
  age_band: <int-int>          # e.g. "28-38"
  emirate: <enum: dubai|abu_dhabi|sharjah|other>
organisation:                                  # required iff segment != Retail
  legal_name_pool: <pool_id>                   # /synthetic-identity-pool/organisations/<pool>.yaml
  signatories:                                 # at least one entry
    - signatory_pool: <pool_id>                # /synthetic-identity-pool/names/<pool>.yaml
      account_role: <one of AEExternalAccountRoleCode enum values; usually
                    Principal | SecondaryOwner | PowerOfAttorney |
                    SeniorManagingOfficial | Administrator>
      party_type: <enum: Sole|Joint|Delegate>  # AEExternalPartyTypeCode
income:
  primary_employer_pool: <pool_id>
  monthly_amount_aed: <int>
  pay_day: <int 1-31>
  variability: <enum: none|low|medium|high>
  flag_payroll: <bool>
cash_flow:                                     # optional; SME/Corporate only
  customer_inflows:
    counterparty_pool: <pool_id>               # /synthetic-identity-pool/counterparties/<pool>.yaml
    monthly_amount_aed_band: <[int, int]>
    invoice_cadence: <enum: weekly|biweekly|monthly|irregular>
  supplier_outflows:
    counterparty_pool: <pool_id>
    monthly_amount_aed_band: <[int, int]>
  payroll_outflow_aed: <int?>
accounts:
  - type: <CurrentAccount|Savings|CreditCard|Mortgage|Finance>
    account_type: <Retail|SME|Corporate>?      # optional override; default = segment
    currency: <ISO 4217>
    age_months: <int>
    credit_limit_aed: <int?>   # only on CreditCard
    at_slot: <slot.key>?       # Phase 2.2 — required only for personas
                               # that hold accounts at >1 LFI. Anchors
                               # each account to one of the slots declared
                               # in multi_lfi_footprint.slots[]. Tagged
                               # accounts at non-primary slots appear in
                               # the corresponding role bundle at
                               # `bundles/<persona>/<slot.key>/<lfi>/`.
                               # All-or-nothing: enforced by
                               # lint-persona-spec-conformance.
fixed_commitments:
  - kind: <standing_order|direct_debit>
    purpose: <string>
    amount_aed: <int?>
    amount_aed_band: <[int, int]?>
    schedule: <monthly_<day>|weekly_<weekday>|annual_<month_<day>>>
    at_slot: <slot.key>?       # Phase 2.2 — when present, the SO/DD
                               # originates from that slot's CurrentAccount
                               # (e.g. mortgage_payment at_slot: mortgage-lender
                               # → the mortgage-lender slot's CurrentAccount in
                               # the role bundle, not the salary primary).
                               # All-or-nothing: enforced by
                               # lint-persona-spec-conformance.
spend_profile:
  groceries_aed_per_month_band: <[int, int]?>
  fuel_aed_per_month_band: <[int, int]?>
  dining_per_month_count_band: <[int, int]?>
fx_activity: <bool>
cash_deposit_activity: <bool>
enable_refunds: <bool>                         # optional; default false.
                                               # Phase R5 — when true, the
                                               # generator emits paired
                                               # refund / reversal credits
                                               # against ~3% of POS /
                                               # ECommerce purchases.
                                               # Side-channel PRNG so
                                               # toggling does not shift
                                               # other tx draws.
distress_signals:
  nsf_events_per_year_band: <[int, int]>
multi_lfi_footprint:                           # optional; D-14
  # TWO ACCEPTED SHAPES — normalizeFootprint() in src/generator/multi-lfi.js
  # canonicalises both to a slots[] array internally.
  #
  # Shape A (legacy D-14): up to three named slots.
  primary:                                     # required if block present
    role: <enum: operating|trade_finance|acquiring|islamic_deposit|escrow|digital_challenger>
    lfi_default: <enum: Rich|Median|Sparse>    # anonymous populate-rate label;
                                               # NEVER bound to a named bank
    plausible_lfi_candidates:                  # named UAE banks ALLOWED here
      - <bank_name_string>                     # purely a candidate set; no
                                               # operational claim binds to any
                                               # one entry
  secondary:                                   # optional
    role: <enum>
    lfi_default: <enum: Rich|Median|Sparse>
    plausible_lfi_candidates:
      - <bank_name_string>
  tertiary:                                    # optional
    role: <enum>
    lfi_default: <enum: Rich|Median|Sparse>
    plausible_lfi_candidates:
      - <bank_name_string>
  #
  # Shape B (Phase 2.2+): N-slot array — preferred for new personas
  # needing more than 3 banking relationships (e.g. retail multi-banked
  # customers). slots[0] is the primary (the persona's "main" LFI);
  # slots[1..] become role bundles at bundles/<persona>/<slot.key>/<lfi>/
  # seed-<n>/. Order matters for cross-LFI ledger Transaction IDs.
  slots:
    - key: <kebab id; URL segment, e.g. "salary", "everyday-card",
            "digital", "mortgage-lender">
      role: <enum: operating|trade_finance|acquiring|islamic_deposit|escrow|
                   digital_challenger|salary_primary|secondary_card|
                   digital_sidekick|international_branch|mortgage_lender>
      lfi_default: <enum: Rich|Median|Sparse>
      plausible_lfi_candidates:
        - <bank_name_string>

multi_insurer_footprint:                       # optional; Phase 2.2.
  # Same shape as the banking slots[], but for insurance carriers. Each
  # slot binds one insurance line (motor/home/health/etc.) to a candidate
  # set of real UAE insurers. Used by multi-domain retail personas
  # holding policies across several carriers.
  slots:
    - line: <enum: motor|home|health|life|travel|renters|employment>
      key: <kebab id; e.g. "motor-primary", "home-mortgage">
      insurer_default: <enum: Rich|Median|Sparse>     # anonymous
      plausible_insurer_candidates:                   # real UAE insurer
        - <insurer_name_string>                       # names allowed here
      cross_domain_link: <multi_lfi_footprint slot.key reference>?
                                                     # optional — anchors
                                                     # this insurance slot
                                                     # to a banking slot
                                                     # (e.g. home insurance
                                                     # to mortgage_lender).
