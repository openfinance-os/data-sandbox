persona_id: sme_cash_heavy
domain: banking
name: "Karim — SME Owner (Cash-Heavy Retail)"
# D-10 — Arabic display name (parallel-text UI; English `name` is the fallback).
name_ar: "كريم — صاحب منشأة صغيرة (تجزئة كثيفة النقد)"
archetype: sme_cash
default_seed: 6308
segment: SME
stress_coverage:
  - cash_dominant_flows

organisation:
  legal_name_pool: sme_mainland
  signatories:
    - signatory_pool: expat_arab
      account_role: Principal
      party_type: Sole

demographics:
  nationality_pool: expat_arab
  age_band: 35-50
  emirate: sharjah

income:
  # SMEs aren't "salaried" — for the purposes of this manifest the principal
  # owner pulls a regular self-pay amount + irregular cash deposits.
  primary_employer_pool: tech_freezone
  monthly_amount_aed: 15000
  pay_day: 28
  variability: medium
  flag_payroll: false

accounts:
  - type: CurrentAccount
    currency: AED
    age_months: 60

fixed_commitments:
  - kind: direct_debit
    purpose: utilities_dewa
    amount_aed_band: [800, 1400]
    schedule: monthly_5
  - kind: direct_debit
    purpose: pos_terminal_lease
    amount_aed: 350
    schedule: monthly_8
  - kind: standing_order
    purpose: shop_rent
    amount_aed: 12000
    schedule: monthly_27

spend_profile:
  groceries_aed_per_month_band: [400, 1200]
  fuel_aed_per_month_band: [200, 500]
  dining_per_month_count_band: [3, 8]

fx_activity: false
cash_deposit_activity: true
cash_deposits_per_month_band: [4, 14]
cash_deposit_amount_aed_band: [800, 8000]

distress_signals:
  nsf_events_per_year_band: [0, 2]

narrative: |
  Karim runs a retail shop in Sharjah. Most receipts are cash deposited
  into the current account in bursts (4–14 deposits/month, AED 800–8k each).
  Sparse merchant detail because the bank can't categorise teller deposits
  the way it can POS transactions. A shop-rent standing order and a POS-
  terminal-lease direct debit are the only fixed commitments. AML stress
  case: behavioural-monitoring rules need to handle cash-dominant accounts.

# D-10 — Arabic narrative (parallel-text UI; English `narrative` is the fallback).
narrative_ar: |
  يدير كريم متجر تجزئة في الشارقة. معظم الإيرادات نقدية تُودَع في الحساب الجاري في دفعات (٤–١٤ إيداعًا شهريًا، ٨٠٠–٨٬٠٠٠ درهم لكلٍّ). تفاصيل تاجر ضئيلة لأن المصرف لا يستطيع تصنيف إيداعات الصرّاف كما يصنّف معاملات نقاط البيع. أمر دائم لإيجار المتجر وخصم مباشر لإيجار جهاز نقاط البيع هما الالتزامان الثابتان الوحيدان. حالة ضغط مكافحة غسل الأموال: تحتاج قواعد الرصد السلوكي إلى التعامل مع الحسابات المهيمن عليها النقد.