persona_id: gcc_commuter_multi
domains: [banking, insurance]
name: "GCC Commuter Multi-Banker — FX-Active 4-Bank Cross-Border"
# D-10 — Arabic display name (parallel-text UI; English `name` is the fallback).
name_ar: "متنقّل خليجي متعدد المصارف — أربعة مصارف نشطة في الصرف عبر الحدود"
archetype: retail_gcc_cross_border_consultant
default_seed: 71956
segment: Retail
stress_coverage:
  # Independent consultant whose engagements span UAE + Saudi + Oman
  # — banking footprint reflects that: AED salary primary, USD
  # offshore for cross-border invoicing, digital sidekick for the
  # in-UAE corporate card, and a second mainstream bank used for
  # GCC-issuer card acceptance. FX-active across all CurrentAccounts.
  # No mortgage (rental in UAE), no auto loan.
  - gcc_cross_border_consulting_fx_multi_lfi

demographics:
  nationality_pool: expat_arab
  age_band: 35-45
  emirate: dubai

income:
  primary_employer_pool: tech_freezone
  monthly_amount_aed: 70000
  pay_day: 28
  variability: medium
  flag_payroll: true

accounts:
  # ── Salary primary (Mashreq-class) ────────────────────────────────
  - type: CurrentAccount
    at_slot: salary
    currency: AED
    age_months: 72
  - type: CreditCard
    at_slot: salary
    currency: AED
    age_months: 60
    credit_limit_aed: 60000
  # ── Offshore trade_finance (Standard Chartered-class) ─────────────
  - type: CurrentAccount
    at_slot: offshore
    currency: USD
    age_months: 60
  - type: Savings
    at_slot: offshore
    currency: USD
    age_months: 36
  # ── Digital sidekick (Wio-class) — corporate-card stack ───────────
  - type: CurrentAccount
    at_slot: digital
    currency: AED
    age_months: 18
  - type: CreditCard
    at_slot: digital
    currency: AED
    age_months: 12
    credit_limit_aed: 30000
  # ── Everyday-card (ADCB-class) — GCC issuer acceptance ────────────
  - type: CurrentAccount
    at_slot: everyday-card
    currency: AED
    age_months: 48
  - type: CreditCard
    at_slot: everyday-card
    currency: AED
    age_months: 36
    credit_limit_aed: 45000

multi_lfi_footprint:
  slots:
    - key: salary
      role: salary_primary
      lfi_default: Median
      plausible_lfi_candidates:
        - "Mashreq Bank"
        - "Emirates NBD"
    - key: offshore
      role: trade_finance
      lfi_default: Rich
      plausible_lfi_candidates:
        - "Standard Chartered Bank"
        - "HSBC Bank Middle East"
        - "Citibank N.A."
    - key: digital
      role: digital_sidekick
      lfi_default: Sparse
      plausible_lfi_candidates:
        - "Wio Bank"
        - "Zand Bank"
    - key: everyday-card
      role: secondary_card
      lfi_default: Median
      plausible_lfi_candidates:
        - "Abu Dhabi Commercial Bank"
        - "First Abu Dhabi Bank"

multi_insurer_footprint:
  slots:
    - line: motor
      key: motor-consultant
      insurer_default: Median
      plausible_insurer_candidates:
        - "AXA Gulf"
        - "Sukoon Insurance"
        - "Orient Insurance"
      cross_domain_link: salary
    - line: travel
      key: travel-gcc-frequent
      insurer_default: Rich
      plausible_insurer_candidates:
        - "AXA Gulf"
        - "Sukoon Insurance"
        - "Orient Insurance"
    - line: life
      key: life-protection
      insurer_default: Rich
      plausible_insurer_candidates:
        - "Sukoon Insurance"
        - "AXA Gulf"

insurance:
  lines: [motor, travel, life]

# Motor — comprehensive on a financed executive sedan
vehicle:
  make: Mercedes-Benz
  model: E-Class
  year: 2023
  body_type: Sedan
  passenger_capacity: 5
  valuation_aed: 280000
  registration_emirate: Dubai
policy:
  type: Comprehensive
  takaful: false
  excess_aed: 3000
  start_date_offset_days: 120
  channel: Broker
finance:
  has_finance: true
  bank_pool: counterparty_banks_uae_real
  amount_aed: 180000
  outstanding_aed: 120000
additional_drivers:
  count: 1
claims:
  history_months: 24
  claims_in_period: 0
  approved_claims: 0
  total_gross_aed: 0

# Travel — annual multi-trip GCC-region policy for client work
travel:
  policy:
    trip_duration_days: 10
    multi_trip: true
    purpose: Business
    travelling_with: Individual
    destination_region: Worldwide
    cover_limit_aed: 60000
    medical_limit_aed: 2000000
    excess_aed: 400
    takaful: false
    product_name: Travel Annual Business Worldwide
    start_date_offset_days: 90
    channel: Broker
  adults: 1
  children: 0
  seniors: 0
  claims:
    history_months: 24
    claims_in_period: 0
    approved_claims: 0
    total_gross_aed: 0

# Life — level-term family protection
life:
  policy:
    cover_type: Sole
    policyholder_life_assured: true
    type_of_life_insurance: LevelTermInsurance
    insurance_purpose: FamilyProtection
    sum_assured_aed: 2500000
    term_years: 20
    takaful: false
    start_date_offset_days: 90
    channel: Broker
    product_name: Family Protection Term
  beneficiaries:
    - relationship: Spouse
    - relationship: Child
  claims:
    history_months: 24
    claims_in_period: 0
    approved_claims: 0
    total_gross_aed: 0

fixed_commitments:
  - kind: standing_order
    purpose: car_loan_payment
    at_slot: salary
    amount_aed: 3800
    schedule: monthly_5
  - kind: standing_order
    purpose: offshore_sweep_usd_savings
    at_slot: offshore
    amount_aed: 12000
    schedule: monthly_28
  - kind: standing_order
    purpose: rent_payment
    at_slot: salary
    amount_aed: 14000
    schedule: monthly_27
  - kind: direct_debit
    purpose: credit_card_repayment_card_digital
    at_slot: digital
    amount_aed_band: [1500, 4500]
    schedule: monthly_12
  - kind: direct_debit
    purpose: credit_card_repayment_card_everyday
    at_slot: everyday-card
    amount_aed_band: [2500, 6500]
    schedule: monthly_10
  - kind: direct_debit
    purpose: utilities_dewa
    at_slot: salary
    amount_aed_band: [800, 1500]
    schedule: monthly_5
  - kind: direct_debit
    purpose: motor_insurance_premium
    at_slot: salary
    amount_aed_band: [800, 1200]
    schedule: monthly_22
  - kind: direct_debit
    purpose: travel_insurance_premium
    at_slot: salary
    amount_aed_band: [500, 800]
    schedule: monthly_22
  - kind: direct_debit
    purpose: life_insurance_premium
    at_slot: salary
    amount_aed_band: [1400, 1800]
    schedule: monthly_22

spend_profile:
  groceries_aed_per_month_band: [2200, 3800]
  fuel_aed_per_month_band: [1200, 2000]
  dining_per_month_count_band: [14, 28]

fx_activity: true
cash_deposit_activity: false

distress_signals:
  nsf_events_per_year_band: [0, 0]

narrative: |
  35–45yo expat-Arab independent consultant in Dubai (AED 70k/mo
  retainer + variable invoicing) splitting time between UAE, Saudi
  and Oman client sites. Four-LFI footprint optimised for the
  cross-border workflow: a mainstream salary primary (day-to-day
  AED + premium business card); a foreign-branch offshore slot
  holding USD CurrentAccount + USD Savings (cross-border invoice
  settlement + retained earnings); a digital sidekick for the
  in-UAE corporate-spend card; a second mainstream relationship
  hosting a GCC-issuer card with strong cross-border acceptance.
  Insurance: motor comprehensive on a financed sedan (cross_domain_
  link → salary), travel annual multi-trip for frequent regional
  travel, family-protection level-term life. The persona's load-
  bearing stress is FX-active cross-border consulting visibility:
  USD inflows + AED outflows + corporate spend are all distributed
  across LFIs; only Open Finance aggregation surfaces the net.

# D-10 — Arabic narrative (parallel-text UI; English `narrative` is the fallback).
narrative_ar: |
  استشاري مستقل عربي وافد (٣٥–٤٥ عامًا) في دبي (أتعاب ٧٠ ألف درهم شهريًا + فوترة متغيّرة) يوزّع وقته بين مواقع عملاء في الإمارات والسعودية وعُمان. بصمة من أربع مؤسسات مالية مُحسَّنة لسير العمل العابر للحدود: راتب أساسي رئيسي (درهم يومي + بطاقة أعمال متميزة)؛ خانة خارجية في فرع أجنبي تحوي حسابًا جاريًا بالدولار + ادخارًا بالدولار (تسوية فواتير عابرة للحدود + أرباح محتجزة)؛ مصرف رقمي مساعد لبطاقة الإنفاق المؤسسي داخل الإمارات؛ علاقة رئيسية ثانية تستضيف بطاقة مُصدِرها خليجي بقبول قوي عبر الحدود. التأمين: مركبات شامل على سيارة مموَّلة (cross_domain_link → الراتب)، وسفر سنوي متعدد الرحلات للتنقل الإقليمي المتكرر، وتأمين حياة عائلي محدد المدة. الضغط الجوهري هو رؤية الاستشارات العابرة للحدود النشطة في الصرف: تتوزّع التدفقات الواردة بالدولار والصادرة بالدرهم والإنفاق المؤسسي عبر المؤسسات المالية كافة؛ ولا يُظهر الصافيَ إلا تجميع التمويل المفتوح.