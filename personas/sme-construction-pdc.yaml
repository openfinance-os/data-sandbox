narrative: |
  Meridian Build Works is a Sharjah-mainland sub-contractor on civil
  works — certified-payment-based receivables from a small set of main
  contractors, milestone-billed and irregular. Inflows arrive 30–60
  days after certification, often net of 5–10% retention; some are
  post-dated cheques. Two signatories: the principal owner (Sole) and
  a delegated power-of-attorney holder authorised for cheque deposit
  and yard-supplier AP. ~80 labourers on a single monthly WPS batch is
  the dominant outflow. Retention release lands as occasional large
  unbatched lump-sum credits months after the original certification.
  Operating account is a Tier-1 conventional bank; secondary at an
  Islamic bank for term deposit of the principal's own savings. NSF
  events occur 1–4 per year — typical for the working-capital squeeze
  of milestone-billed civil-works SMEs. Stress: PDC handling, retention
  release matching, large-batch WPS payroll — none of which the existing
  SME personas exercise.

# D-10 — Arabic narrative (parallel-text UI; English `narrative` is the fallback).
narrative_ar: |
  ميريديان لأعمال البناء مقاول من الباطن للأعمال المدنية في بر الشارقة الرئيسي — مستحقات قائمة على شهادات الدفع من مجموعة صغيرة من المقاولين الرئيسيين، تُفوتر بالمراحل وغير منتظمة. تصل التدفقات الواردة بعد ٣٠–٦٠ يومًا من المصادقة، غالبًا صافيًا من احتجاز ٥–١٠٪؛ وبعضها شيكات مؤجلة الدفع. مفوّضان بالتوقيع: المالك الأساسي (منفرد) وحامل وكالة قانونية مفوَّض لإيداع الشيكات وذمم موردي الساحة. نحو ٨٠ عاملًا في دفعة شهرية واحدة لنظام حماية الأجور هي التدفق الصادر المهيمن. يصل تحرير المحتجز كائتمانات دفعة كبيرة عرضية غير مُجمَّعة بعد أشهر من المصادقة الأصلية. الحساب التشغيلي مصرف تقليدي من الفئة الأولى؛ والثانوي في مصرف إسلامي لوديعة لأجل من مدخرات المالك الخاصة. تقع أحداث الرصيد غير الكافي ١–٤ مرات سنويًا — معتاد لضغط رأس المال العامل لمنشآت الأعمال المدنية المُفوترة بالمراحل. الضغط: التعامل مع الشيكات المؤجلة، ومطابقة تحرير المحتجز، ودفعة رواتب نظام حماية الأجور الكبيرة — لا تختبر أيًّا منها شخصيات المنشآت الصغيرة القائمة.