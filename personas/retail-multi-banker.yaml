# Banking fixed commitments — all hosted on the salary primary
# CurrentAccount (the only CurrentAccount in the primary bundle once
# at_slot filtering is applied).
fixed_commitments:
  - kind: standing_order
    purpose: mortgage_payment
    amount_aed: 14000
    schedule: monthly_1
  - kind: standing_order
    purpose: car_loan_payment
    amount_aed: 4800
    schedule: monthly_5
  - kind: direct_debit
    purpose: credit_card_repayment_card_everyday
    amount_aed_band: [3000, 8000]
    schedule: monthly_10
  - kind: direct_debit
    purpose: credit_card_repayment_card_digital
    amount_aed_band: [800, 2500]
    schedule: monthly_12
  - kind: direct_debit
    purpose: utilities_dewa
    amount_aed_band: [900, 1800]
    schedule: monthly_5
  - kind: direct_debit
    purpose: home_insurance_premium
    amount_aed_band: [2400, 3200]
    schedule: monthly_22
  - kind: direct_debit
    purpose: motor_insurance_premium
    amount_aed_band: [350, 550]
