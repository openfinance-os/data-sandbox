persona_id: retail_multi_banker
domains: [banking, insurance]
name: "Retail Multi-Banker — Four-Bank, Three-Carrier"
archetype: salaried_multi_banker
default_seed: 99072
segment: Retail
stress_coverage:
  # Phase 2.2 flagship persona — exercises the full multi-LFI +
  # multi-domain stack. The two tags below are added by this persona
  # (verified globally unique by lint-stress-coverage-uniqueness).
  - retail_multi_lfi_aggregation_consolidation
  - retail_multi_product_dbsr_visibility

demographics:
  nationality_pool: expat_arab
  age_band: 38-50
  emirate: dubai

income:
  primary_employer_pool: tech_freezone
  monthly_amount_aed: 65000
  pay_day: 25
  variability: low
  flag_payroll: true                          # WPS salary → primary slot

# 10 accounts spread across 4 LFI slots. Phase 2.2 at_slot tagging
# anchors each account to one slot in multi_lfi_footprint.slots[] below.
# All-or-nothing per lint-persona-spec-conformance.
accounts:
  # ── Salary primary (ADCB equivalent) ──────────────────────────────
  - type: CurrentAccount
    at_slot: salary
    currency: AED
    age_months: 96
  - type: CreditCard
    at_slot: salary
    currency: AED
    age_months: 72
    credit_limit_aed: 50000
  - type: CreditCard
    at_slot: salary
    currency: AED
    age_months: 48
    credit_limit_aed: 80000
  - type: Finance
    at_slot: salary
    currency: AED
    age_months: 24
  # ── Everyday-card secondary (ENBD equivalent) ─────────────────────
  - type: CurrentAccount
    at_slot: everyday-card
    currency: AED
    age_months: 60
  - type: CreditCard
    at_slot: everyday-card
    currency: AED
    age_months: 36
    credit_limit_aed: 40000
  # ── Digital sidekick (Wio equivalent) ─────────────────────────────
  - type: CurrentAccount
    at_slot: digital
    currency: AED
    age_months: 18
  - type: CreditCard
    at_slot: digital
    currency: AED
    age_months: 12
    credit_limit_aed: 20000
  # ── Mortgage-lender / international branch (HSBC equivalent) ──────
  - type: CurrentAccount
    at_slot: mortgage-lender
    currency: AED
    age_months: 84
  - type: Mortgage
    at_slot: mortgage-lender
    currency: AED
    age_months: 60

multi_lfi_footprint:
  slots:
    - key: salary
      role: salary_primary
      lfi_default: Median
      plausible_lfi_candidates:
        - "Abu Dhabi Commercial Bank"
        - "First Abu Dhabi Bank"
        - "Mashreq Bank"
    - key: everyday-card
      role: secondary_card
      lfi_default: Median
      plausible_lfi_candidates:
        - "Emirates NBD"
        - "Commercial Bank of Dubai"
    - key: digital
      role: digital_sidekick
      lfi_default: Sparse
      plausible_lfi_candidates:
        - "Wio Bank"
        - "Zand Bank"
    - key: mortgage-lender
      role: international_branch
      lfi_default: Rich
      plausible_lfi_candidates:
        - "HSBC Bank Middle East"
        - "Standard Chartered Bank"
        - "Citibank N.A."

multi_insurer_footprint:
  slots:
    - line: motor
      key: motor-primary
      insurer_default: Median
      plausible_insurer_candidates:
        - "Sukoon Insurance"
        - "Orient Insurance"
        - "AXA Gulf"
    - line: home
      key: home-mortgage
      insurer_default: Median
      plausible_insurer_candidates:
        - "Sukoon Insurance"
        - "Salama Islamic Arab Insurance"
        - "Orient Insurance"
      cross_domain_link: mortgage-lender         # home cover bundled with HSBC mortgage
    - line: travel
      key: travel-annual
      insurer_default: Rich
      plausible_insurer_candidates:
        - "AXA Gulf"
        - "Sukoon Insurance"

