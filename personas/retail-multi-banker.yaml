spend_profile:
  groceries_aed_per_month_band: [2200, 3800]
  fuel_aed_per_month_band: [900, 1400]
  dining_per_month_count_band: [10, 22]

fx_activity: true
cash_deposit_activity: false

distress_signals:
  nsf_events_per_year_band: [0, 0]

narrative: |
  The "Connect-journeys hero" persona — a 38–50 year-old expat-Arab
  professional living in Dubai with a senior salaried role (AED 65k/mo
  WPS payroll). Banking footprint spans four LFI slots: the salary
  primary holds the day-to-day CurrentAccount plus two consumer credit
  cards and a car loan; a secondary mainstream relationship hosts a
  CurrentAccount plus a parallel everyday card; a digital-only sidekick
  hosts a CurrentAccount plus a low-limit digital card; an
  international-branch slot hosts the CurrentAccount + mortgage on the
  Dubai villa. Insurance footprint mirrors the banking spread: motor
  comprehensive bundled with the car loan, home insurance bundled with
  the mortgage (cross_domain_link → mortgage-lender), and a family
  annual travel policy.

  The persona's load-bearing stress is **multi-LFI aggregation
  consolidation**: total debt service (mortgage + car loan + three
  cards) is only legible to a TPP via Open Finance aggregation across
  all four banks — no single LFI sees the full picture. The cross-LFI
  mirror ledger demonstrates salary-to-non-primary sweeps every month,
  closing the reference loop between primary and role bundles by IBAN
  identity. EXP-18 underwriting-scenario panel and the Connect
  three-journey J2 (TPP + Al Tareq) consent flow are both built for
  exactly this persona's shape.
