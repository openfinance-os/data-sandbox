# Insurance persona manifest schema — Phase 2.0 (Motor) + Phase 2.1 (+Home).
# Mirrors personas/_schema.yaml (banking) for domain: insurance.
#
# Each personas/*.yaml with `domain: insurance` must conform to this shape.
# Validated in CI by tests/persona-manifest.test.mjs.
#
# The persona describes INPUTS to the per-line generator, not the generated
# output. Identity bits (PolicyHolder name, Emirates ID, Visa, mobile, email,
# address) are synthesized by the generator from demographics.nationality_pool
# + emirate. Persona only declares the narrative parameters that drive a
# coherent insurance bundle.
#
# `line` discriminates which generator runs. Motor personas may omit the
# field for back-compat (defaults to 'motor'). Home personas declare
# `line: home` and a `home:` block; health personas declare `line: health`
# and a `health:` block; life personas declare `line: life` and a `life:`
# block. The remaining 3 lines (Employment, Travel, Renters) + Insurance
# Consents will extend this schema as their generators land.

persona_id: <slug>
domain: insurance
line: <enum: motor|home|health|life>  # optional — defaults to 'motor' if absent
name: <string>
archetype: <string>                # e.g. motor_comprehensive_financed
default_seed: <int>
stress_coverage:
  - <term>                         # insurance-specific Appendix-F vocab

demographics:
  nationality_pool: <pool_id>      # references /synthetic-identity-pool/names/<pool>.yaml
  age_band: <int-int>              # e.g. "30-40"
  emirate: <enum: AbuDhabi|Ajman|Dubai|Fujairah|RasAlKhaimah|Sharjah|UmmAlQuwain>
  has_visa: <bool>                 # emirati: false; expat: true

# ---------------------------------------------------------------------------
# Motor blocks (line: motor) — drive AEMotorInsurancePolicyProperties1.
# ---------------------------------------------------------------------------

vehicle:                           # required when line=motor
  make: <string>                   # e.g. "Toyota"
  model: <string>                  # e.g. "Corolla"
  year: <int>                      # 4-digit model year
  body_type: <string>              # e.g. "Sedan", "SUV"
  passenger_capacity: <int>        # incl. driver
  valuation_aed: <int>             # current market value
  registration_emirate: <enum: AbuDhabi|Ajman|Dubai|Fujairah|RasAlKhaimah|Sharjah|UmmAlQuwain>

policy:                            # required when line=motor
  type: <enum: Comprehensive|ThirdPartyLiability>
  takaful: <bool>                  # Sharia-compliant?
  excess_aed: <int>
  start_date_offset_days: <int>    # days before `now` anchor (deterministic)
  channel: <enum: Direct|Broker|Aggregator>

finance:                           # optional — omit if no car finance
  has_finance: <bool>
  bank_pool: <pool_id?>            # references /synthetic-identity-pool/banks/<pool>.yaml
  amount_aed: <int?>
  outstanding_aed: <int?>

additional_drivers:
  count: <int>                     # 0..3

claims:                            # used by line=motor; line=home uses home.claims
  history_months: <int>            # length of claims-summary window
  claims_in_period: <int>          # total claims in the window
  approved_claims: <int>           # subset of claims_in_period
  total_gross_aed: <int>           # sum of approved-claim payouts

# ---------------------------------------------------------------------------
# Home block (line: home) — drives AEHomeInsurancePolicyProperties1.
# Required when line=home; omitted otherwise.
# ---------------------------------------------------------------------------

home:
  property:
    type_of_property: <enum: Villa|House|Apartment|Flat>
    ownership_status: <enum: Owner|OwnerWithMortgage|Landlord|Tenant>
    address_emirate: <enum: AbuDhabi|Ajman|Dubai|Fujairah|RasAlKhaimah|Sharjah|UmmAlQuwain>
    number_of_floors: <int>
    number_of_rooms: <int>
    year_of_construction: <int>    # 4-digit year
  property_value:
    market_value_aed: <int>        # current market value
    appraisal_value_aed: <int>     # most recent appraisal
    purchase_price_aed: <int>      # original purchase price
  mortgage:                        # optional — omit if owned outright
    has_mortgage: <bool>
    bank_pool: <pool_id?>          # references /synthetic-identity-pool/banks/<pool>.yaml
    balance_aed: <int?>
    monthly_payment_aed: <int?>
  policy:
    excess_aed: <int>
    start_date_offset_days: <int>
    channel: <enum: Direct|Agent|Broker|Bank|Aggregator>
    takaful: <bool>
  claims:
    history_months: <int>
    claims_in_period: <int>
    approved_claims: <int>
    total_gross_aed: <int>

# ---------------------------------------------------------------------------
# Health block (line: health) — drives AEHealthInsurancePolicyProperties1.
# Required when line=health; omitted otherwise.
# ---------------------------------------------------------------------------

health:
  policy:
    cover_subjects: <enum: Self|SelfAndSpouse|Spouse|SelfAndFamily|Dependents|Other>
    policyholder_insured: <bool>     # true when policyholder is also an insured person
    type_of_policy: <enum: HealthInsuranceIndividual|PersonalAccidentInsurance>
    annual_limit_aed: <int>          # cover-limit ceiling for inpatient cover
    excess_aed: <int>
    care_network: <string>           # e.g. "Network Plus", "Standard"
    regions_coverage: <string>       # e.g. "UAE", "GCC", "Worldwide ex-USA"
    takaful: <bool>
    product_name: <string>           # business name shown to the customer
    start_date_offset_days: <int>
    channel: <enum: Direct|Agent|Broker|Bank|TPA|Aggregator>
  employment:                        # required to surface PolicyHolder.Employment block
    employer_name: <string>
    monthly_income_aed: <int>        # required when employment present
    salary_band: <enum: NoSalary|BelowAED4000PerMonth|AED4000ToAED12000PerMonth|AED12001AndAbove>
    profession: <string?>
    job_title: <string?>
  insured_parties:                   # optional dependents — emits AEHealthInsuranceDataSharingInsuredParty[]
    - relationship: <enum: Self|Spouse|Child|Parent|Other>
      age: <int>
      gender: <enum: Male|Female|Other>
      given_name: <string?>
      surname: <string?>
  sponsor:                           # optional — drives AEHealthInsuranceSponsorProperties[]
    type: <enum: Resident|Citizen|Establishment|PropertyOwner>
    entity_id: <string>
    entity_id_type: <enum: FileNumber|UID|EstablishmentCode>
  claims:
    history_months: <int>
    claims_in_period: <int>
    approved_claims: <int>
    total_gross_aed: <int>

# ---------------------------------------------------------------------------
# Life block (line: life) — drives AELifeInsurancePolicyProperties1.
# Required when line=life; omitted otherwise.
# ---------------------------------------------------------------------------

life:
  policy:
    cover_type: <enum: Sole|Joint>
    policyholder_life_assured: <bool>
    type_of_life_insurance: <enum: WholeLifeInsurance|LevelTermInsurance|DecreasingTermInsurance>
    insurance_purpose: <enum: PersonalCover|FamilyProtection|MortgageCover>
    sum_assured_aed: <int>
    term_years: <int>                # used to compute PolicyTerm + PolicyEndDate
    takaful: <bool>
    product_name: <string?>          # business name shown to customer
    start_date_offset_days: <int>
    channel: <enum: Direct|Agent|Broker|Bank|InvFinInst|Aggregator>
  insured_parties:                   # additional life-assured beyond the policyholder
    - relationship: <enum: Self|Spouse|Child|Parent|Other>
      age: <int>
      gender: <enum: Male|Female|Other>
      given_name: <string?>
      surname: <string?>
  beneficiaries:                     # nominees on the death benefit
    - relationship: <enum: Self|Spouse|Child|Parent|Other>
      given_name: <string?>
      surname: <string?>
  finance:                           # optional — set when policy assigned to mortgage / loan
    has_finance: <bool>
    bank_pool: <pool_id?>            # references /synthetic-identity-pool/banks/<pool>.yaml
    amount_aed: <int>
    value_against_policy_aed: <int?> # defaults to amount_aed
  claims:
    history_months: <int>
    claims_in_period: <int>
    approved_claims: <int>
    total_gross_aed: <int>
