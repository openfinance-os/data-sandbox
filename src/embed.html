<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Open Finance Data Sandbox · embed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%236E548F%27/%3E%3Ctext x=%278%27 y=%2712%27 font-family=%27system-ui,sans-serif%27 font-size=%2710%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23fff%27%3E%C2%A4%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* Chrome-less variant — strip the topbar / nav / footer; render only the
     active endpoint's table at full viewport. */
  body { margin: 0; }
  .embed-host {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .embed-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }
  .embed-strip .label {
    flex: 1 1 auto;
    color: var(--text-muted);
  }
  .embed-avatar {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    overflow: hidden;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .embed-avatar:empty { display: none; }
  .embed-avatar svg { display: block; width: 100%; height: 100%; }
  .embed-strip a {
    color: var(--accent);
    text-decoration: none;
  }
  .embed-strip a:hover { text-decoration: underline; }
  .embed-body {
    flex: 1 1 auto;
    overflow: auto;
    padding: 8px;
  }
  .embed-banner {
    padding: 4px 8px;
    background: var(--warn-bg);
    border-bottom: 1px solid var(--warn-border);
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="embed-host" id="embed-host">
  <div class="embed-banner" role="status">
    <strong>SYNTHETIC.</strong> Generated from UAE Open Finance Standards v2.1 OpenAPI spec — not from any real bank.
  </div>
  <div class="embed-strip" role="contentinfo">
    <span class="embed-avatar" id="embed-avatar"></span>
    <span class="label" id="embed-label">/accounts</span>
    <a href="#" id="embed-link" target="_blank" rel="noopener noreferrer">Open in sandbox →</a>
  </div>
  <div class="embed-body" id="embed-body" tabindex="0"></div>
</div>
<script type="module" src="embed.js"></script>
</body>
</html>
