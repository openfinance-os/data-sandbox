# Dependabot config — weekly batched updates for npm + GitHub Actions.
# Minor and patch bumps are grouped into a single PR per ecosystem to
# avoid PR-spam; majors arrive as individual PRs so reviewers can read
# the upgrade notes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Dubai
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /packages/sandbox-fixtures
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    groups:
      sandbox-fixtures-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /packages/sandbox-mcp
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    groups:
      sandbox-mcp-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Dubai
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
