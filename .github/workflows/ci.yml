name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: 'Run --update-snapshots for the visual project and open a PR with the refreshed PNGs.'
        type: boolean
        default: false

# Cancel superseded PR runs so a fresh push doesn't leave stale runs
# occupying a runner. Pushes to main never cancel (we want every
# main-branch commit to finish and report its result).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default token for every job. The baseline-refresh job
# opts up to contents/pull-requests write at the job level where it needs
# to push a branch and open a PR.
permissions:
  contents: read

jobs:
  # Lints the workflow files themselves (YAML syntax, unknown context
  # expressions, shellcheck on `run:` blocks). Fast — runs in ~5s and
  # in parallel with the heavy `test` job below.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run verify:spec-shape
      - run: npm run build:spec
      - run: npm run build:data
      - run: npm run build:avatars
      # tests/fixture-package.test.mjs reads from packages/sandbox-fixtures/
      # which is generated, not checked in. Use the :pkgs variant since
      # build:spec already ran above.
      - run: npm run build:fixtures:pkgs
      # Fail fast if dist/ artifacts are stale relative to sources, so a
      # contributor who forgot to re-bake them sees a clear signal here
      # rather than a downstream test surprise. MUST run after
      # build:fixtures:pkgs — check-dist-clean.mjs compares the freshly
      # generated packages/sandbox-fixtures/ files against the committed
      # state, so running it before the build makes that half of the check
      # trivially pass (the tool's own header says so).
      - run: npm run check:dist-clean
      # tests/integrate-staging.test.mjs reads from _site/, which stage-site.mjs
      # populates.
      - run: node tools/stage-site.mjs
      # Lints + eslint + prettier all run in parallel (run-p in package.json
      # `lint` script). Cuts ~10s off the lint phase.
      - run: npm run lint
      # Surfaces persona-data conformance against the pinned UAE Open Finance
      # v2.1 OpenAPI specs as a named CI step (EXP-01 + EXP-10). Wraps:
      #   - lint-persona-spec-conformance (persona-manifest enums vs spec enums)
      #   - spec-validation.test.mjs (banking in-memory bundle AJV check)
      #   - spec-validation.insurance.test.mjs (insurance in-memory bundle AJV)
      #   - rendered-fixture-spec-validation.test.mjs (every emitted fixture)
      # A failure here points the reader directly at the conformance contract
      # rather than burying it inside `npm test`.
      - name: Validate persona data conforms to v2.1 OpenAPI spec
        run: npm run validate:spec-conformance
      - run: npm test
      # @openfinance-os/sandbox-mcp has its own vitest config under
      # packages/sandbox-mcp/. Exercises the determinism + watermark + HTTP
      # transport guarantees against the just-built fixture corpus.
      - run: npm run test:mcp
      # Share the built artefacts with the e2e and lighthouse jobs so they
      # don't have to rebuild spec/data/fixtures from scratch on fresh runners.
      - name: Upload built artefacts
        uses: actions/upload-artifact@v7
        with:
          name: built-artefacts
          path: |
            dist/
            _site/
            packages/sandbox-fixtures/
            packages/sandbox-fixtures-py/
          retention-days: 1
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    # Skip the regular e2e run on the workflow_dispatch path that's
    # dedicated to refreshing visual baselines (handled by e2e-update-baselines).
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.update_visual_baselines != 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Download built artefacts
        uses: actions/download-artifact@v8
        with:
          name: built-artefacts
      # Cache Playwright browser binaries. Keyed on package-lock so the
      # cache invalidates whenever @playwright/test bumps. Saves ~60–90s
      # per run on a cache hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      # Run all cross-browser / mobile projects PLUS the visual-regression
      # project. Linux baselines were committed in 942e6ae; before this line
      # included `visual`, the only workflow that ran the project was
      # e2e-update-baselines with --update-snapshots, which by definition
      # can never fail — i.e. visual regression was never actually gating.
      # Refresh baselines via the e2e-update-baselines workflow_dispatch.
      - run: |
          npx playwright test \
            --project=chromium-desktop \
            --project=firefox-desktop \
            --project=webkit-desktop \
            --project=mobile-chrome \
            --project=mobile-webkit \
            --project=visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
      # On failure, also upload raw test-results (traces, screenshots, videos)
      # so a maintainer can drag the trace into trace.playwright.dev without
      # re-running locally.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/

  # Manual trigger to refresh visual baselines on a Linux runner (CI parity).
  # Set workflow_dispatch input update_visual_baselines=true to run.
  e2e-update-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_visual_baselines == 'true'
    needs: test
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Download built artefacts
        uses: actions/download-artifact@v8
        with:
          name: built-artefacts
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Regenerate visual baselines
        run: npx playwright test --project=visual --update-snapshots
      - name: Open PR with refreshed baselines
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-visual-baselines
          title: 'chore: refresh Playwright visual baselines'
          commit-message: 'chore: refresh Playwright visual baselines'
          body: |
            Refreshed Playwright `visual` project baselines via workflow_dispatch.
            Inspect the diffs in `tests/e2e/visual.spec.mjs-snapshots/` before
            merging.
          add-paths: tests/e2e/visual.spec.mjs-snapshots/

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Download built artefacts
        uses: actions/download-artifact@v8
        with:
          name: built-artefacts
      - run: npm run test:perf
      # Note: lhci uploads each run's report to temporary-public-storage
      # (URLs printed in the job log). No local artifact upload needed —
      # the previous `actions/upload-artifact` step warned about a missing
      # .lighthouseci/ directory because lhci doesn't write one when the
      # target is the public-storage cloud.
