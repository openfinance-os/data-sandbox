name: Deploy sandbox-mcp to Fly.io

# Continuous-deploy the hosted MCP endpoint that backs the Claude
# marketplace listing under PRD D-13. Fires on every `mcp-v*` tag, after
# `publish-mcp.yml` has built and published the npm package + ghcr image.
#
# Tokens required (Settings → Secrets):
#   FLY_API_TOKEN — `flyctl auth token` from a deploy-only token
#                   (`flyctl tokens create deploy --app of-sandbox-mcp`).
#
# First-time setup is manual (`flyctl launch --copy-config`); see the
# header comment in fly.toml. This workflow only handles incremental
# redeploys.

on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Override per environment if the Fly app is renamed; the smoke job
  # uses this hostname to validate that the deploy actually came up.
  MCP_PUBLIC_URL: https://of-sandbox-mcp.fly.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job will fail clearly with "FLY_API_TOKEN is not set" if the secret
    # is missing — set it before cutting the first `mcp-v*` tag.
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    # Catches the "Fly says deployed but container is crash-looping" case:
    # asserts /health returns ok:true and that an MCP initialize +
    # tools/list roundtrip returns the documented 16 tools.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Smoke-test the deployed endpoint
        run: node packages/sandbox-mcp/scripts/smoke.mjs "$MCP_PUBLIC_URL"
