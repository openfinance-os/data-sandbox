name: npm audit

# Scan the complete dependency tree weekly and on demand. Development
# tooling executes in CI and is included in the same gate as runtime packages.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run audit:dependencies

  public-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check public static reads and site/MCP parity
        run: python3 tools/check-public-access.py
      - name: Upload public delivery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-access-report
          path: artifacts/public-access.json
          if-no-files-found: error
