name: Publish fixtures

# Publishes @openfinance-os/sandbox-fixtures (npm) and
# openfinance-os-sandbox-fixtures (PyPI) when a tag matching
# fixtures-v* is pushed.
#
# Tokens required (set in repo Settings → Secrets):
#   NPM_TOKEN  — npm publish token with publish access to the
#                @openfinance-os scope
#   PYPI_TOKEN — PyPI API token scoped to the project (or a project-
#                specific Trusted Publisher OIDC config — preferred)

on:
  push:
    tags: ['fixtures-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Gate: never publish a broken or spec-invalid build to npm / PyPI.
  # Runs the full CI (verify-spec-shape → build → lints → vitest → MCP tests)
  # before either publish job can start.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run ci

  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build:fixtures
      - name: Publish to npm
        working-directory: packages/sandbox-fixtures
        run: npm publish --access=public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, publish-npm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build:fixtures
      - name: Build wheel + sdist
        working-directory: packages/sandbox-fixtures-py
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sandbox-fixtures-py/dist/
