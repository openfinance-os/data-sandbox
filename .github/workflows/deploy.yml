name: Deploy

# Production deploys are gated on a green CI run: this workflow fires only
# after the `CI` workflow completes, and the build job below additionally
# requires conclusion == success on a push to main. workflow_dispatch stays
# available only for a main revision with successful CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Don't interrupt a Pages deploy mid-flight; queue follow-ups instead.
# Scope per ref so manual `workflow_dispatch` runs on branches don't
# block the main-branch production deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The trusted selector enforces successful same-repository main CI for
    # automatic and manual releases, then checks out that exact revision.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Trusted code validates the successful main CI revision before release credentials.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Select exact validated main revision
        id: revision
        run: node tools/verify-release-revision.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run verify:spec-shape
      - run: npm run build:site
        env:
          # EXP-21 / D-08 — tools/stage-site.mjs reads this and injects
          # the `<script src="vendor/posthog-config.js">` into the
          # staged entry HTMLs. PostHog project keys are public-by-design
          # (they ship in every visitor's HTML on every PostHog-using
          # site) but we still funnel through a GH Actions secret so the
          # source tree stays key-free and a key rotation is a one-click
          # secret update rather than a code change. If the secret is
          # unset (e.g. a fork build) stage-site logs that analytics will
          # be off and the EXP-21 contract holds trivially.
          #
          # NOTE — this env var only reaches the GitHub Pages build. If
          # the production origin is served by Cloudflare Pages / Netlify
          # / Vercel / Fly, those platforms run their own build container
          # and don't see GitHub Actions secrets. Set POSTHOG_KEY in each
          # platform's own dashboard. tools/stage-site.mjs has the full
          # rundown of where to add it per platform.
          SANDBOX_REVISION: ${{ steps.revision.outputs.revision }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
