name: Deploy

# Production deploys are gated on a green CI run: this workflow fires only
# after the `CI` workflow completes, and the build job below additionally
# requires conclusion == success on a push to main. workflow_dispatch stays
# available for manual (re)deploys regardless of CI state.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't interrupt a Pages deploy mid-flight; queue follow-ups instead.
# Scope per ref so manual `workflow_dispatch` runs on branches don't
# block the main-branch production deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Only deploy a commit that CI actually passed. For workflow_dispatch
    # (manual) the workflow_run context is empty, so the guard short-circuits
    # to true and we deploy the dispatched ref.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Check out the trusted default branch. We deliberately do NOT check out
      # github.event.workflow_run.head_sha: this is a privileged job (Pages
      # write + id-token + POSTHOG_KEY) and checking out the event's head SHA
      # is the "pwn-request" pattern CodeQL flags. The `if` guard already
      # restricts this workflow to push-to-main, and a default checkout
      # resolves to that same trusted main tip (worst case it deploys a
      # slightly newer main commit, which self-corrects on its own run).
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run verify:spec-shape
      - run: npm run build:site
        env:
          # EXP-21 / D-08 — tools/stage-site.mjs reads this and injects
          # the `<script src="vendor/posthog-config.js">` into the
          # staged entry HTMLs. PostHog project keys are public-by-design
          # (they ship in every visitor's HTML on every PostHog-using
          # site) but we still funnel through a GH Actions secret so the
          # source tree stays key-free and a key rotation is a one-click
          # secret update rather than a code change. If the secret is
          # unset (e.g. a fork build) stage-site logs that analytics will
          # be off and the EXP-21 contract holds trivially.
          #
          # NOTE — this env var only reaches the GitHub Pages build. If
          # the production origin is served by Cloudflare Pages / Netlify
          # / Vercel / Fly, those platforms run their own build container
          # and don't see GitHub Actions secrets. Set POSTHOG_KEY in each
          # platform's own dashboard. tools/stage-site.mjs has the full
          # rundown of where to add it per platform.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
