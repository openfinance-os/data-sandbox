name: Publish sandbox-mcp

# Publishes @openfinance-os/sandbox-mcp to npm and a multi-arch container
# image to ghcr.io when a tag matching `mcp-v*` is pushed.
#
# The container image is what hosts at mcp.openfinance-os.org/sandbox under
# PRD D-13 — anonymous, CORS-open Streamable HTTP MCP server.
#
# Tokens required (Settings → Secrets):
#   NPM_TOKEN  — npm publish token with publish access to @openfinance-os
# (GHCR uses the workflow's GITHUB_TOKEN automatically.)

on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build:fixtures
      - run: npm run test:mcp
      - name: Publish to npm
        working-directory: packages/sandbox-mcp
        run: npm publish --access=public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: publish-npm
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/sandbox-mcp
          tags: |
            type=match,pattern=mcp-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/sandbox-mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
