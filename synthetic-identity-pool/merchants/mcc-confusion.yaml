pool_id: mcc_confusion_table
description: |
  Synthetic ISO 18245 MCC confusion table — models real card-scheme
  misrouting patterns. The bank-side raw transaction may emit a wrong-but-
  plausible MCC (mirroring real-world acquirer behaviour); the enrichment
  sidecar carries the corrected ground-truth so a TPP testing
  MCC-correction logic can score the engine end-to-end.

  Each entry: `correct` is the canonical MCC the merchant pool declares;
  `wrong` is the list of plausible misrouted codes the scheme actually
  emits in production; `reason` documents the misrouting mechanism (kept
  alongside the data so reviewers can spot a pattern that's stopped
  matching reality).

  Misrouting rate is calibrated in src/generator/mcc-noise.js — default
  is 5% per applicable transaction. Side-channel PRNG keyed on
  TransactionId, so adding/tuning this table doesn't shift the main
  RNG state (EXP-05 fingerprints stay byte-stable for any tx that
  doesn't actually flip).
