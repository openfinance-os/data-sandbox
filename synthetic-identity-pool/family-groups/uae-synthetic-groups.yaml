pool_id: family_groups_uae_synthetic
description: |
  Synthetic UAE family-conglomerate groups — all fictional. Mirrors a
  load-bearing UAE retail-reality stressor for transaction enrichment:
  most international brands here are operated under franchise by a
  small set of large local conglomerates, and a real bank statement
  shows the group's commercial entity in the narrative alongside the
  brand (e.g. an Alshaya-franchised Starbucks tx in UAE may post as
  'ALSHAYA STARBUCKS DXB' on the wire). Naïve enrichment that resolves
  on the brand alone misses the ownership graph, so a TPP testing
  receivables-clustering, loyalty inference, or concentration-risk
  analysis needs synthetic data that carries the structural property.
  Names + brand attributions are entirely synthetic — no real-group
  data is reproduced (NG4 / NG5 / D-14 honoured).
